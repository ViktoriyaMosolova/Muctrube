<!DOCTYPE html>
<html lang="en">

<head>
	<meta charset="UTF-8">
	<link type="text/css" href="../css/common.css" rel="stylesheet">
	<link type="text/css" href="../css/header.css" rel="stylesheet">
	<link type="text/css" href="../css/menu.css" rel="stylesheet">
	<link type="text/css" href="../css/style-font-lbl-btn.css" rel="stylesheet">

	<link type="text/css" href="../css/watching-video.css" rel="stylesheet">
	<meta http-equiv="X-UA-Compatible" content="IE=edge">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<link rel="preconnect" href="https://fonts.gstatic.com">
	<link href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;500;700&display=swap" rel="stylesheet">
	<title>MuctRube</title>
	<!-- <link rel="icon" href="..\img\Untitled_white_icon.png"> -->
</head>

<body>
	<header>
		<div>
			<button><img id="hamburger" src="..\img\hamburger.png"></button>
			<img id="logoMuctRube" src="..\img\Untitled_white1.png">
		</div>
		<div>
			<div>
				<button onclick="location.href='createvideo.html'" img="..\img\icon-menu-createvideo.png">
					<img id="createvideo" src="..\img\icon-menu-createvideo.png">
					<label>Создать видео</label>
				</button>
			</div>
			<img onclick="location.href='profile.html'" id="photo-profile" src="..\img\photoprofile.jpg">
		</div>
		<main>
			<div id="menu">
				<div>
					<button onclick="location.href='main.html'" type="button">
						<img id="icon-menu-main" src="..\img\icon-menu-main.png" alt="Иконка меню">
						<label>Главная</label>
					</button>
				</div>
				<div>
					<button onclick="location.href='playlist.html'" type="button">
						<img id="icon-menu-playlist" src="..\img\icon-menu-playlist.png" alt="Иконка меню">
						<label>Плейлисты</label>
					</button>
				</div>
				<div>
					<button onclick="location.href='contact.html'" type="button">
						<img id="icon-menu-contact" src="..\img\icon-menu-contact.png" alt="Иконка меню">
						<label>Контакты</label>
					</button>
				</div>
			</div>
			<div id="content">
				<div id="player">
					<iframe src="https://www.youtube.com/embed/BleoYk_Eprs" title="YouTube video player" frameborder="0"
						allowfullscreen></iframe>
					<label margin="6px 0" id="sty1" font-size="20px">Название видео Название видео Название...</label>
					<div class="channel-info">
						<img src="..\img\photoprofile.jpg" alt="Логотип канала">
						<div class="channel-text">
							<label>Название вашего канала</label>
							<div class="channel-buttons">
								<button>Подписаться</button>
								<button>Нравится</button>
								<button>Не нравится</button>
							</div>
						</div>
					</div>
				</div>
				<div id="comments">
					<h2>Комментарии</h2>
					<ul>
						<li class="comment">
							<img src="..\img\photoprofile.jpg" alt="Фото комментатора">
							<div class="comment-text">
								<label>Имя комментатора</label>
								<label>Текст комментария</label>
							</div>
						</li>
						<li class="comment">
							<img src="..\img\photoprofile.jpg" alt="Фото комментатора">
							<div class="comment-text">
								<label>Имя комментатора</label>
								<label>Текст комментария</label>
							</div>
						</li>
						<!-- Добавьте сколько угодно комментариев -->
					</ul>
				</div>
				<div id="playlist">
					<h2>Видео в плейлисте</h2>
					<ul>
						<li class="video">
							<video src="https://youtu.be/1DJIClmpA-I"></video>
							<div class="video-text">
								<label>Название вашего видео</label>
								<label>Описание видео</label>
							</div>
						</li>
						<li class="video">
							<video src="https://youtu.be/1DJIClmpA-I"></video>
							<div class="video-text">
								<label>Название вашего видео</label>
								<label>Описание видео</label>
							</div>
						</li>
						<!-- Добавьте сколько угодно видео -->
					</ul>
				</div>
			</div>
		</main>
</body>

</html>
