<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <link type="text/css" href="../css/common.css" rel="stylesheet">
    <link type="text/css" href="../css/header.css" rel="stylesheet">
    <link type="text/css" href="../css/menu.css" rel="stylesheet">
    <link type="text/css" href="../css/style-font-lbl-btn.css" rel="stylesheet">

    <link type="text/css" href="../css/profile.css" rel="stylesheet">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="preconnect" href="https://fonts.gstatic.com">
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;500;700&display=swap" rel="stylesheet">
    <title>MuctRube</title>
    <!-- <link rel="icon" href="..\img\Untitled_white_icon.png"> -->
</head>

<body>
    <header>
        <div>
            <button><img id="hamburger" src="..\img\hamburger.png"></button>
            <img id="logoMuctRube" src="..\img\Untitled_white1.png">
        </div>
        <div id="title">
            <label>Профиль</label>
        </div>
        <div>
            <div>
                <button onclick="location.href='createvideo.html'" img="..\img\icon-menu-createvideo.png">
                    <img id="createvideo" src="..\img\icon-menu-createvideo.png">
                    <label>Создать видео</label>
                </button>
            </div>
            <img onclick="location.href='profile.html'" id="photo-profile" src="..\img\photoprofile.jpg">
        </div>
    </header>
    <main>
        <div id="menu">
            <div>
                <button onclick="location.href='main.html'" type="button">
                    <img id="icon-menu-main" src="..\img\icon-menu-main.png" alt="Иконка меню">
                    <label>Главная</label>
                </button>
            </div>
            <div>
                <button onclick="location.href='playlist.html'" type="button">
                    <img id="icon-menu-playlist" src="..\img\icon-menu-playlist.png" alt="Иконка меню">
                    <label>Плейлисты</label>
                </button>
            </div>
            <div>
                <button onclick="location.href='contact.html'" type="button">
                    <img id="icon-menu-contact" src="..\img\icon-menu-contact.png" alt="Иконка меню">
                    <label>Контакты</label>
                </button>
            </div>
        </div>
        <div id="profile-form">
            <form>
                <div class="form-group">
                    <div class="photo-wrapper">
                        <img id="photo-profile" src="../img/photoprofile.jpg">
                    </div>
                    <div class="profile-buttons">
                        <button type="button">Изменить фото</button>
                    </div>
                </div>
                <div class="form-group">
                    <label for="name">Имя</label>
                    <input type="text" id="name" name="name">
                </div>
                <div class="form-group">
                    <label for="username">Логин</label>
                    <input type="text" id="username" name="username">
                </div>
                <div class="form-group">
                    <label for="password">Пароль</label>
                    <input type="password" id="password" name="password">
                </div>
                <div class="form-group">
                    <button type="submit">Сохранить</button>
                </div>
                <div class="profile-buttons">
                    <button href="login.html" type="button">Выйти</button>
                    <button href="register.html" type="button">Удалить аккаунт</button>
                </div>
            </form>
        </div>
    </main>
</body>

</html>
